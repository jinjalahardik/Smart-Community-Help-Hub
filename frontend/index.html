<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Smart Community Help Hub connects donors, NGOs, hospitals, volunteers and requesters for food, clothes, medicine and blood donations, and emergency relief coordination." />
    <meta name="theme-color" content="#F8FAFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#081411" media="(prefers-color-scheme: dark)" />
    <script>
      // Applied before React mounts so the correct theme class is present
      // for first paint (avoids a light-mode flash for dark-mode users).
      (function () {
        try {
          var STORAGE_KEY = 'smart-community-theme';
          var stored = localStorage.getItem(STORAGE_KEY);
          var theme = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = theme === 'system' ? (systemDark ? 'dark' : 'light') : theme;
          var root = document.documentElement;
          if (resolved === 'dark') {
            root.classList.add('dark');
            document.querySelector('meta[name="theme-color"]:not([media])')?.setAttribute('content', '#081411');
          }
          root.setAttribute('data-theme', resolved);
        } catch (e) {
          // localStorage may be unavailable (privacy mode, etc). Fall back to light.
        }
      })();
    </script>
    <title>Smart Community Help Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
